spring.application.name=gimnasio-reservas

# H2 en memoria (ADR-0005)
spring.datasource.url=jdbc:h2:mem:gimnasio;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# El esquema se genera desde las entidades JPA
spring.jpa.hibernate.ddl-auto=create-drop

# Las transacciones terminan en la capa de aplicación
spring.jpa.open-in-view=false

# Swagger UI muestra el contrato autoritativo
springdoc.swagger-ui.url=/gimnasio-openapi.yaml

# Consola H2 solo para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console